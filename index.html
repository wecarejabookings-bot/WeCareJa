    <style>
      @keyframes wecarePulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .sk-pulse {
        animation: wecarePulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;

    <div id="root">
      <!-- Fast First-Paint Skeleton (eliminates blank white screen for Google Core Web Vitals) -->
      <div style="min-height: 100vh; background-color: #0F172A; padding: 16px; max-width: 1280px; margin: 0 auto; box-sizing: border-box;">
        <!-- Header Skeleton -->
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(30,27,75,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; margin-bottom: 24px;">

            <div class="sk-pulse" style="width: 40px; height: 40px; border-radius: 14px; background-color: #F59E0B;"></div>
            <div>
              <div class="sk-pulse" style="width: 140px; height: 16px; margin-bottom: 4px;"></div>
              <div class="sk-pulse" style="width: 90px; height: 10px;"></div>
            </div>
          </div>
          <div style="display: flex; gap: 8px;">
            <div class="sk-pulse" style="width: 80px; height: 36px; border-radius: 12px;"></div>
            <div class="sk-pulse" style="width: 90px; height: 36px; border-radius: 12px;"></div>
          </div>
        </div>

        <!-- Hero Skeleton -->
        <div style="background: linear-gradient(135deg, rgba(30,27,75,0.5) 0%, rgba(15,23,42,0.8) 100%); border: 1px solid rgba(99,102,241,0.2); border-radius: 28px; padding: 36px 24px; margin-bottom: 24px; text-align: center;">
          <div class="sk-pulse" style="width: 220px; height: 26px; margin: 0 auto 16px; border-radius: 999px;"></div>
          <div class="sk-pulse" style="width: 80%; max-width: 560px; height: 38px; margin: 0 auto 14px;"></div>
          <div class="sk-pulse" style="width: 60%; max-width: 420px; height: 18px; margin: 0 auto 28px;"></div>
          <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <div class="sk-pulse" style="width: 160px; height: 48px; border-radius: 16px;"></div>
            <div class="sk-pulse" style="width: 180px; height: 48px; border-radius: 16px;"></div>
          </div>
        </div>

        <!-- Cards Grid Skeleton -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
          <div class="sk-pulse" style="height: 140px; border-radius: 20px;"></div>
          <div class="sk-pulse" style="height: 140px; border-radius: 20px;"></div>
          <div class="sk-pulse" style="height: 140px; border-radius: 20px;"></div>
        </div>
      </div>
