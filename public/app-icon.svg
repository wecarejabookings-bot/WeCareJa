      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1A1E4E" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />
  
  <g transform="translate(46, 56) scale(0.82)">
