    <rect x="237" y="193" width="42" height="16" rx="4" fill="#F59E0B" />

    <!-- Nurse Head, Hair & Neck Silhouette -->
    <path d="M 218 252 C 200 262 188 282 188 306 C 188 336 210 354 234 354 C 234 366 226 384 206 414 L 286 450 C 290 416 304 380 326 348 C 328 342 332 330 326 322 C 320 314 316 316 314 310 C 310 298 322 284 322 270 C 322 258 316 250 306 248 Z" 
